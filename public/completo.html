<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Botánico — Completo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f0f12;--card:#17171c;--text:#eaeaf0;--muted:#b5b5c0;--accent:#cfa56a;}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center}
    .card{background:var(--card);max-width:560px;width:92%;padding:34px 28px;border-radius:14px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .brand{font-family:"Playfair Display",serif;font-size:30px;letter-spacing:.08em;margin-bottom:8px}
    .title{font-family:"Playfair Display",serif;font-size:24px;margin:0 0 10px}
    .desc{color:var(--muted);line-height:1.7;margin:0 0 18px}
    .note{color:var(--muted);font-size:13px;margin:0}
    .line{height:1px;background:rgba(255,255,255,.08);margin:18px 0}
    .accent{color:var(--accent)}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">BOTÁNICO</div>
    <h1 class="title">Reservas completas</h1>
    <p class="desc">
      La edición de <span class="accent">San Valentín</span> ya se encuentra completa.
      Gracias por tu interés.
    </p>
    <div class="line"></div>
    <p class="note">Turno único: 21:00 · Tolerancia máxima: 15 minutos</p>
  </div>
</body>
</html>
