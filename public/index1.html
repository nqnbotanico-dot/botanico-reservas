<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Botánico — San Valentín</title>
  <link rel="stylesheet" href="./css/styles1.css" />
</head>

<body class="bg-soft">
  <!-- Rail lateral con logo -->
  <aside class="brand-rail">
    <img class="brand-logo" src="./assets/logo-botanico.jpg" alt="Botánico" />
  </aside>

  <main class="shell">
    <!-- Header -->
    <header class="topbar">
      <div>
        <div class="script">Botanico</div>
        <h1 class="title">San Valentín</h1>
        <p class="subtitle">21:00</p>
      </div>

      <!-- Botón reserva -->
      <a class="btn btn-primary" href="./reserva.html">
        Reservar
      </a>
    </header>

    <!-- Menú -->
    <section class="card menu-card">
      <div class="menu-image-wrap">
        <img
          class="menu-image"
          src="./assets/menu.jpg"
          alt="Menú especial San Valentín"
        />
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span>© Botánico</span>
      <span class="dot">•</span>
      <span>San Valentín</span>
    </footer>
  </main>
</body>
</html>
