<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Botánico — Reserva confirmada</title>

  <!-- Tipografías elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f0f12;
      --card: #17171c;
      --text: #eaeaf0;
      --muted: #b5b5c0;
      --accent: #cfa56a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card);
      max-width: 480px;
      width: 92%;
      padding: 32px 28px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .brand {
      font-family: "Playfair Display", serif;
      font-size: 28px;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .status {
      font-family: "Playfair Display", serif;
      font-size: 22px;
      margin-bottom: 12px;
    }

    .desc {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 26px;
    }

    .details {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 26px;
    }

    .details div {
      margin-bottom: 6px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all .25s ease;
    }

    .btn-wa {
      background: var(--accent);
      color: #0f0f12;
    }

    .btn-wa:hover {
      transform: translateY(-1px);
      opacity: .9;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">BOTÁNICO</div>
    <div class="subtitle">San Valentín · Turno único 21:00</div>

    <div id="statusTitle" class="status">Procesando reserva…</div>
    <div id="statusDesc" class="desc">
      Estamos verificando el estado de tu pago.
    </div>

    <div id="details" class="details hidden">
      <div id="dName"></div>
      <div id="dPeople"></div>
      <div>Tolerancia máxima: 15 minutos</div>
    </div>

    <div id="waWrap" class="hidden">
      <a id="waBtn" class="btn btn-wa" href="#" target="_blank" rel="noopener">
        Confirmar por WhatsApp
      </a>
      <div class="hint">
        Se abrirá WhatsApp con el mensaje listo para enviar.
      </div>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const status = (qs.get("status") || qs.get("collection_status") || "").toLowerCase();
    const external = qs.get("external_reference") || "";

    const fullName = localStorage.getItem("bot_fullName") || "";
    const adults = Number(localStorage.getItem("bot_adults") || 0);
    const kids = Number(localStorage.getItem("bot_kids") || 0);
    const total = adults + kids;

    const statusTitle = document.getElementById("statusTitle");
    const statusDesc = document.getElementById("statusDesc");
    const details = document.getElementById("details");

    if (status === "approved") {
      statusTitle.textContent = "Reserva confirmada";
      statusDesc.textContent =
        "Tu lugar para la noche de San Valentín ha sido reservado correctamente.";

      document.getElementById("dName").textContent =
        fullName ? `Nombre: ${fullName}` : "";
      document.getElementById("dPeople").textContent =
        total ? `Comensales: ${total} (Adultos ${adults} · Niños ${kids})` : "";

      details.classList.remove("hidden");

      fetch(`/api/whatsapp-link?fullName=${encodeURIComponent(fullName)}&adults=${adults}&kids=${kids}&total=${total}&external_reference=${encodeURIComponent(external)}`)
        .then(r => r.json())
        .then(j => {
          if (j.ok && j.url) {
            document.getElementById("waBtn").href = j.url;
            document.getElementById("waWrap").classList.remove("hidden");
          }
        });
    } else if (status === "pending") {
      statusTitle.textContent = "Pago pendiente";
      statusDesc.textContent =
        "Tu pago está siendo procesado. En cuanto se confirme, tu reserva quedará registrada.";
    } else {
      statusTitle.textContent = "No se pudo completar el pago";
      statusDesc.textContent =
        "El pago no fue aprobado. Podés intentar nuevamente o contactarnos.";
    }
  </script>

</body>
</html>
